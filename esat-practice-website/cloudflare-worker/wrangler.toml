name = "esat-sync-worker"
main = "sync-worker.js"
compatibility_date = "2024-01-01"
workers_dev = true

[[kv_namespaces]]
binding = "KV"
id = "795bdd0dc9d047b5a214d80a10188f06"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 30
period = 60

# Separate, stricter limiter for the AI endpoint since each request costs LLM tokens.
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 8
period = 60

# GEMINI_API_KEY is a secret, not a var — set it with:
#   npx wrangler secret put GEMINI_API_KEY
