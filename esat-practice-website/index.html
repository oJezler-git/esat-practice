<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101412" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Resolve visual settings before first paint so React doesn't briefly
      // show the default shell while the persisted settings hydrate.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("esat-settings"));
          var settings =
            stored && stored.state && stored.state.settings
              ? stored.state.settings
              : {};
          var theme = settings.theme;
          var light =
            theme === "light" ||
            ((theme === "auto" || theme === undefined) &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.dataset.theme = "light";

          if (settings.skin === "plain") {
            document.documentElement.dataset.skin = "plain";
          }

          if (
            ["rose", "emerald", "teal", "azure", "indigo"].indexOf(
              settings.colorTheme,
            ) !== -1
          ) {
            document.documentElement.dataset.colorTheme = settings.colorTheme;
          }

          if (
            [
              "academic",
              "premium",
              "readable",
              "modern",
              "technical",
              "inter",
              "monospace",
            ].indexOf(settings.fontPreset) !== -1
          ) {
            document.documentElement.dataset.fontPreset = settings.fontPreset;
          }
        } catch (e) {
          /* fall through to the dark/default shell */
        }
      })();
    </script>
    <meta
      name="description"
      content="Practice ESAT-style questions with timed sessions, topic drills, and progress tracking."
    />
    <meta name="apple-mobile-web-app-title" content="ESAT Practice" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="ESAT Practice" />
    <meta
      property="og:description"
      content="Practice ESAT-style questions with timed sessions, topic drills, and progress tracking."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=Caveat:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
    />
    <title>ESAT Practice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
